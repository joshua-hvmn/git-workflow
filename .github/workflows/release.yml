# Tag-triggered release, paired with `git b pre` and `git b finish`.
#
#   v1.3.0-rc.1  (any tag containing "-")  -> GitHub *prerelease*, from any branch
#   v1.3.0       (plain vX.Y.Z)            -> full release, only if the commit is on main
#
# Copy this file into another repo and change the "Build" step to produce that
# project's artifacts.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags, for the "is it on main" check

      - name: Classify tag
        id: tag
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) echo "prerelease=true"  >>"$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >>"$GITHUB_OUTPUT" ;;
          esac

      - name: Stable tags must be on main
        if: steps.tag.outputs.prerelease == 'false'
        run: |
          commit=$(git rev-parse "$GITHUB_REF_NAME^{commit}")
          git merge-base --is-ancestor "$commit" origin/main || {
            echo "::error::$GITHUB_REF_NAME is not on main; stable releases come from 'git b finish'."
            exit 1
          }

      - name: VERSION must match the tag
        run: |
          want="${GITHUB_REF_NAME%%-*}" # v1.3.0-rc.1 -> v1.3.0
          have=$(cat VERSION)
          [ "$have" = "$want" ] || {
            echo "::error::VERSION says $have but the tag is $GITHUB_REF_NAME. Bump VERSION on the release branch."
            exit 1
          }

      - name: Lint and test
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bats shellcheck mandoc
          make lint test installcheck

      - name: Build
        run: make dist DIST_REF="$GITHUB_REF_NAME" DIST_NAME="git-workflow-$GITHUB_REF_NAME"

      # The CHANGELOG section for this version ("## v1.3.0 ..."); a prerelease
      # uses the section of the version it leads up to.
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME%%-*}"
          awk -v v="$version" '/^## / { on = ($2 == v); next } on' CHANGELOG.md >notes.md
          if [ -s notes.md ]; then
            echo "Using the CHANGELOG section for $version"
          else
            echo "::warning::No '## $version' section in CHANGELOG.md; generating notes from commits."
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          flags=(--verify-tag --title "$GITHUB_REF_NAME")
          if [ -s notes.md ]; then
            flags+=(--notes-file notes.md)
          else
            flags+=(--generate-notes)
          fi
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" git-workflow-"$GITHUB_REF_NAME".tar.gz*
