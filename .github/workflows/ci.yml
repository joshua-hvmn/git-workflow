name: ci

on:
  push:
    branches: [main, next, "release/**", "hotfix/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats and shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats shellcheck
      - name: Lint
        run: make lint
      - name: Test
        run: make test
