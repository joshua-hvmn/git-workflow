name: ci

on:
  push:
    branches: [main, next, "release/**", "hotfix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck, shfmt, and mandoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck shfmt mandoc
      - name: Lint
        run: make lint

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install bats (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats

      - name: Install bats (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core

      # macOS ships Bash 3.2 as /bin/bash. Put it first on PATH so
      # `#!/usr/bin/env bash` runs the oldest Bash the README promises.
      - name: Use the system Bash 3.2 (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -s /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >>"$GITHUB_PATH"

      - name: Versions
        run: bash --version | head -n 1 && git --version && bats --version

      - name: Test
        run: make test

      - name: Test an installed copy
        run: make installcheck
